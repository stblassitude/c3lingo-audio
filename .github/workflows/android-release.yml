# Builds signed APKs for a tag such as v1.2.0, as made by ./release, and publishes them
# as a GitHub release, with the release notes committed for F-Droid. The app bundle goes
# to Google Play's internal testing track, together with the store listing from
# android/fastlane/metadata/android/.
name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for the previous tag.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Both are set in android/app/build.gradle.kts by ./release; F-Droid reads them there too.
      - name: Determine version
        id: version
        run: |
          gradle=android/app/build.gradle.kts
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' "$gradle")
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' "$gradle")
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match versionName $name in $gradle."
            exit 1
          fi
          notes=android/fastlane/metadata/android/en-US/changelogs/$code.txt
          if [ ! -s "$notes" ]; then
            echo "::error::No release notes in $notes; see 'Releasing' in README.md."
            exit 1
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing; see 'Releasing the Android app' in README.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # A separate run, as the APKs are split by ABI only when no bundle is built.
      - name: Build app bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Write release notes
        env:
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            cat "$NOTES"
            echo
            echo "Most phones need the \`arm64-v8a\` APK; \`universal\` works on all of them."
            if [ -n "$previous" ]; then
              echo
              echo "All changes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk)
            cp "$apk" "dist/c3lingo-audio-$VERSION-${abi#app-}.apk"
          done
          ls -l dist
          # A re-run, after a later step failed, replaces the APKs.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "c3lingo audio $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Upload to Google Play
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          if [ -z "$GOOGLE_PLAY_JSON_KEY" ]; then
            echo "::error::The GOOGLE_PLAY_JSON_KEY secret is missing; see 'Releasing the Android app' in README.md."
            exit 1
          fi
          cd android
          bundle exec fastlane upload_internal \
            aab:"$PWD/app/build/outputs/bundle/release/app-release.aab"
