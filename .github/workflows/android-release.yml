# Builds signed APKs for a tag such as v1.2.0 and publishes them as a GitHub
# release, with the commits since the previous v* tag as release notes. The app
# bundle goes to Google Play's internal testing track.
name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: for the release notes and the version code.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # Grows with every commit, as Android requires for updates.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing; see 'Releasing the Android app' in README.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      # A separate run, as the APKs are split by ABI only when no bundle is built.
      - name: Build app bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :app:bundleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
              range="$previous..$GITHUB_REF_NAME"
            else
              echo "Changes:"
              range="$GITHUB_REF_NAME"
            fi
            echo
            git log --no-merges --format='- %s' "$range"
            echo
            echo "Most phones need the \`arm64-v8a\` APK; \`universal\` works on all of them."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk)
            cp "$apk" "dist/c3lingo-audio-$VERSION-${abi#app-}.apk"
          done
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "c3lingo audio $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Upload to Google Play
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ -z "$GOOGLE_PLAY_JSON_KEY" ]; then
            echo "::error::The GOOGLE_PLAY_JSON_KEY secret is missing; see 'Releasing the Android app' in README.md."
            exit 1
          fi
          # The commit list as "What's new", in whole lines up to Play's 500 characters.
          changelogs=android/fastlane/metadata/android/en-US/changelogs
          mkdir -p "$changelogs"
          grep '^- ' "$RUNNER_TEMP/notes.md" \
            | awk '{ n += length($0) + 1; if (n > 500) exit; print }' \
            > "$changelogs/$VERSION_CODE.txt"
          cat "$changelogs/$VERSION_CODE.txt"
          cd android
          bundle exec fastlane upload_internal \
            aab:"$PWD/app/build/outputs/bundle/release/app-release.aab"
