# Builds the app for iOS, macOS and visionOS for a tag such as v1.2.0, as made by
# ./release, and uploads each to App Store Connect, where they show up in TestFlight once
# Apple has processed them. Then the texts in apple/fastlane/metadata/ and the release
# notes go to the version being prepared for the App Store on each platform.
name: Apple TestFlight

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  testflight:
    strategy:
      # A failing platform doesn't hold up the others' uploads.
      fail-fast: false
      matrix:
        platform: [iOS, macOS, visionOS]
    name: testflight (${{ matrix.platform }})
    # Xcode 27 is still a preview image; macos-26 only goes up to Xcode 26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: for the build number.
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Determine version
        id: version
        run: |
          name=${GITHUB_REF_NAME#v}
          gradle=android/app/build.gradle.kts
          if ! grep -q "^ *versionName = \"$name\"$" "$gradle"; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match versionName in $gradle; see 'Releasing' in README.md."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Grows with every commit, as App Store Connect requires for each upload.
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # Xcode doesn't always come with the visionOS SDK.
      - name: Install the visionOS SDK
        if: matrix.platform == 'visionOS'
        run: |
          if ! xcodebuild -showsdks | grep -q xros; then
            xcodebuild -downloadPlatform visionOS
          fi

      - name: Set up App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "::error::App Store Connect secrets are missing; see 'Releasing the Apple app' in README.md."
            exit 1
          fi
          echo "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "AUTH_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "AUTH_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
            echo "AUTH_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # Automatic signing archives with a development certificate. Without one in the
      # keychain, Xcode creates a new one on every run, until the account has as many as
      # Apple allows. The export signs for the App Store with Apple's cloud signing.
      - name: Set up the signing certificate
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_SIGNING_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_CERTIFICATE_PASSWORD" ]; then
            echo "::error::The signing certificate secrets are missing; see 'Releasing the Apple app' in README.md."
            exit 1
          fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/signing.p12"
          # Lets codesign use the key without asking.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: apple
        run: >
          xcodebuild archive
          -scheme c3lingo-audio
          -destination 'generic/platform=${{ matrix.platform }}'
          -archivePath build/c3lingo-audio.xcarchive
          -allowProvisioningUpdates
          -authenticationKeyPath "$AUTH_KEY_PATH"
          -authenticationKeyID "$AUTH_KEY_ID"
          -authenticationKeyIssuerID "$AUTH_ISSUER_ID"
          MARKETING_VERSION=${{ steps.version.outputs.name }}
          CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}

      - name: Upload to App Store Connect
        working-directory: apple
        run: >
          xcodebuild -exportArchive
          -archivePath build/c3lingo-audio.xcarchive
          -exportOptionsPlist ExportOptions.plist
          -exportPath build/export
          -allowProvisioningUpdates
          -authenticationKeyPath "$AUTH_KEY_PATH"
          -authenticationKeyID "$AUTH_KEY_ID"
          -authenticationKeyIssuerID "$AUTH_ISSUER_ID"

      - name: Remove the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

  # Once for all platforms, after the builds: the platforms share the app's information
  # in App Store Connect, so uploading it from each build at the same time would conflict.
  metadata:
    needs: testflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Upload App Store metadata
        working-directory: apple
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
          APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
        run: |
          echo "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" bundle exec fastlane upload_metadata platforms:ios,osx,xros
